<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RVC Voice Converter</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>RVC Voice Converter</h1>

        <section class="drop-zone" id="dropZone">
            <div class="drop-zone-content">
                <span class="drop-icon">&#x1F3B5;</span>
                <p id="dropText">Drag & drop an audio file here, or click to browse</p>
                <p class="drop-hint">WAV or MP3 &bull; Max 10 minutes</p>
            </div>
            <input type="file" id="fileInput" accept="audio/wav,audio/mpeg,.wav,.mp3" hidden>
        </section>

        <section class="controls">
            <div class="control-group">
                <label for="voiceSelect">Voice</label>
                <select id="voiceSelect">
                    <option value="">Loading voices...</option>
                </select>
            </div>

            <div class="control-group">
                <label for="transpose">Transpose <span class="hint">(semitones)</span></label>
                <input type="number" id="transpose" value="0" step="1">
            </div>

            <div class="control-group">
                <label>F0 Method</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="f0method" value="pm" checked>
                        PM
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="f0method" value="harvest">
                        Harvest
                    </label>
                </div>
            </div>

            <div class="control-group">
                <label for="indexRateRange">Index Rate <span id="indexRateValue" class="hint">0.50</span></label>
                <div class="dual-control">
                    <input type="range" id="indexRateRange" min="0" max="1" step="0.01" value="0.50">
                    <input type="number" id="indexRateNumber" min="0" max="1" step="0.01" value="0.50">
                </div>
            </div>

            <button id="generateBtn" disabled>Generate</button>
        </section>

        <section class="progress" id="progressSection" style="display: none;">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p class="progress-text" id="progressText">Uploading audio...</p>
        </section>

        <section class="result" id="resultSection" style="display: none;">
            <h2>Result</h2>
            <audio id="audioPlayer" controls></audio>
            <button id="downloadBtn" class="secondary">Download Audio</button>
        </section>

        <section class="error" id="errorSection" style="display: none;">
            <p id="errorMessage"></p>
        </section>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
